AWSTemplateFormatVersion: "2010-09-09"
Description: Fernwell MERN app on one Amazon Linux 2023 EC2 instance. nginx serves the React build and proxies /api to the Express API.

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t2.small, t2.medium, t3.micro, t3.small, t3.medium]
    Description: EC2 instance size (t2.micro is free-tier friendly).
  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR allowed to SSH to the instance. GitHub-hosted runners have no fixed IP, so the default is open; restrict it to your own IP if you prefer.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Public SSM parameter that always points to the latest Amazon Linux 2023 AMI.

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-key"

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fernwell app - SSH and HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
            DeleteOnTermination: true
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail

          # nginx serves React; node/npm run the Express API. Build tools let bcrypt install on this instance.
          dnf install -y nginx nodejs npm gcc-c++ make python3

          # The project uses mongodb://127.0.0.1:27017/fernwell, so run MongoDB on this instance too.
          cat > /etc/yum.repos.d/mongodb-org-8.0.repo <<'MONGO'
          [mongodb-org-8.0]
          name=MongoDB Repository
          baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/8.0/x86_64/
          gpgcheck=1
          enabled=1
          gpgkey=https://pgp.mongodb.com/server-8.0.asc
          MONGO
          dnf install -y mongodb-org
          systemctl enable --now mongod

          mkdir -p /opt/fernwell/backend
          chown -R ec2-user:ec2-user /opt/fernwell /usr/share/nginx/html

          # Replace the default nginx config: one server that serves the SPA and proxies /api to Express.
          cat > /etc/nginx/nginx.conf <<'NGINX'
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log warn;
          pid /run/nginx.pid;

          events {
            worker_connections 1024;
          }

          http {
            include /etc/mime.types;
            default_type application/octet-stream;
            sendfile on;
            keepalive_timeout 65;

            server {
              listen 80 default_server;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              # /api/auth/login -> http://127.0.0.1:8000/auth/login
              location = /api {
                proxy_pass http://127.0.0.1:8000/;
                proxy_set_header Host $host;
              }

              location /api/ {
                proxy_pass http://127.0.0.1:8000/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              # React Router: send unknown paths back to index.html
              location / {
                try_files $uri $uri/ /index.html;
              }
            }
          }
          NGINX

          # The workflow uploads backend files and .env to this folder, then restarts the service.
          cat > /etc/systemd/system/fernwell-api.service <<'SERVICE'
          [Unit]
          Description=Fernwell Express API
          After=network-online.target mongod.service
          Wants=network-online.target mongod.service

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/fernwell/backend
          ExecStart=/usr/bin/node index.js
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          nginx -t
          systemctl enable --now nginx
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref Instance
  PublicIp:
    Description: Public IP of the instance (changes after a stop/start)
    Value: !GetAtt Instance.PublicIp
  PublicDns:
    Description: Public DNS name of the instance
    Value: !GetAtt Instance.PublicDnsName
  KeyPairId:
    Description: Key pair ID; CloudFormation stores the private key in SSM at /ec2/keypair/<KeyPairId>
    Value: !GetAtt KeyPair.KeyPairId
  KeyName:
    Description: Name of the EC2 key pair
    Value: !Ref KeyPair
  WebsiteURL:
    Description: Fernwell website URL
    Value: !Sub "http://${Instance.PublicIp}"
  ApiURL:
    Description: Fernwell API URL through the nginx proxy
    Value: !Sub "http://${Instance.PublicIp}/api"
